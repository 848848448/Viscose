<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viscose</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><text x='50' y='68' text-anchor='middle' font-size='60' font-weight='bold' fill='white'>V</text></svg>">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#fafafa;--bg2:#fff;--text:#111;--text2:#555;--text3:#999;
      --line:#e5e5e5;--accent:#111;--accent-fg:#fff;
      --input-bg:#fff;--input-border:#d0d0d0;--input-focus:#111;
      --red:#c0392b;--green:#27ae60;--blue:#2980b9;
      --shadow:0 1px 2px rgba(0,0,0,0.04);
    }
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
      --bg:#111;--bg2:#1a1a1a;--text:#e5e5e5;--text2:#aaa;--text3:#666;
      --line:#2a2a2a;--accent:#e5e5e5;--accent-fg:#111;
      --input-bg:#1a1a1a;--input-border:#333;--input-focus:#e5e5e5;
      --shadow:0 1px 2px rgba(0,0,0,0.2);
    }}
    :root[data-theme="dark"]{
      --bg:#111;--bg2:#1a1a1a;--text:#e5e5e5;--text2:#aaa;--text3:#666;
      --line:#2a2a2a;--accent:#e5e5e5;--accent-fg:#111;
      --input-bg:#1a1a1a;--input-border:#333;--input-focus:#e5e5e5;
      --shadow:0 1px 2px rgba(0,0,0,0.2);
    }

    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
    .hidden{display:none!important}

    /* AUTH SCREENS */
    .auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .auth-box{width:100%;max-width:420px}
    .auth-logo{font-size:1.4rem;font-weight:600;letter-spacing:-0.02em;margin-bottom:40px}
    .auth-box h1{font-size:1.8rem;font-weight:600;letter-spacing:-0.02em;margin-bottom:6px}
    .auth-box .sub{color:var(--text2);font-size:1rem;margin-bottom:28px}

    .field{margin-bottom:18px}
    .field label{display:block;font-size:0.9rem;font-weight:500;color:var(--text2);margin-bottom:6px}
    .field input,.field select{
      width:100%;padding:14px 16px;background:var(--input-bg);border:1px solid var(--input-border);
      border-radius:8px;color:var(--text);font-size:1rem;font-family:inherit;outline:none;transition:border-color 0.15s;
    }
    .field input:focus,.field select:focus{border-color:var(--input-focus)}

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:13px 24px;border-radius:8px;font-size:1rem;font-weight:500;
      border:1px solid var(--line);cursor:pointer;font-family:inherit;transition:all 0.15s;
      background:var(--bg2);color:var(--text);text-decoration:none;
    }
    .btn:hover{border-color:var(--text3)}
    .btn-dark{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
    .btn-dark:hover{opacity:0.85}
    .btn-red{background:var(--red);color:#fff;border-color:var(--red)}
    .btn-red:hover{opacity:0.85}
    .btn-sm{padding:10px 18px;font-size:0.9rem}
    .btn-full{width:100%}

    .alert{padding:12px 16px;border-radius:8px;font-size:0.95rem;margin-bottom:16px;border:1px solid}
    .alert-error{background:rgba(192,57,43,0.06);color:var(--red);border-color:rgba(192,57,43,0.15)}
    .alert-ok{background:rgba(39,174,96,0.06);color:var(--green);border-color:rgba(39,174,96,0.15)}

    /* APP LAYOUT */
    .app{display:flex;min-height:100vh}
    .side{
      width:250px;background:var(--bg2);border-right:1px solid var(--line);
      padding:24px 16px;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;
    }
    .side-logo{font-size:1.2rem;font-weight:600;letter-spacing:-0.02em;padding:0 8px;margin-bottom:32px}
    .side-nav{flex:1;display:flex;flex-direction:column;gap:2px}
    .side-nav a{
      display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:8px;
      color:var(--text2);text-decoration:none;font-size:1rem;font-weight:500;transition:all 0.15s;
    }
    .side-nav a:hover{color:var(--text);background:var(--bg)}
    .side-nav a.active{color:var(--text);background:var(--bg)}
    .side-nav a .ico{width:20px;text-align:center;font-size:0.9rem;opacity:0.6}
    .side-foot{padding-top:16px;border-top:1px solid var(--line);font-size:0.9rem}
    .side-foot .name{font-weight:600;color:var(--text);font-size:1rem}
    .side-foot .role{color:var(--text3);font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}

    .main{flex:1;margin-left:250px;padding:32px 40px}
    .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .page-head h2{font-size:1.4rem;font-weight:600;letter-spacing:-0.01em}

    /* TABLE */
    .card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:14px 18px;font-size:0.8rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--line);font-weight:500}
    td{padding:14px 18px;font-size:1rem;border-bottom:1px solid var(--line)}
    tr:last-child td{border-bottom:none}
    .badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.03em}
    .badge-sa{background:rgba(192,57,43,0.08);color:var(--red)}
    .badge-admin{background:rgba(41,128,185,0.08);color:var(--blue)}
    .badge-user{background:rgba(39,174,96,0.08);color:var(--green)}

    /* ADDRESS CARDS */
    .addr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .addr-card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:20px}
    .addr-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .addr-card-top span{font-weight:600;font-size:1.05rem}
    .addr-card-top .actions{display:flex;gap:4px}
    .addr-card-top .actions button{background:none;border:none;cursor:pointer;padding:4px 6px;color:var(--text3);font-size:0.85rem;border-radius:4px;transition:0.15s}
    .addr-card-top .actions button:hover{background:var(--bg);color:var(--text)}
    .addr-body{color:var(--text2);font-size:1rem;margin-bottom:14px;line-height:1.6}
    .map-btn{
      display:inline-flex;align-items:center;gap:6px;font-size:0.9rem;font-weight:500;
      color:var(--text2);text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:6px;transition:0.15s;
    }
    .map-btn:hover{border-color:var(--text3);color:var(--text)}

    /* MODAL */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
    .modal{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
    .modal h3{font-size:1.05rem;font-weight:600;margin-bottom:20px}
    .modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

    .empty{text-align:center;padding:48px 20px;color:var(--text3);font-size:0.9rem}

    /* MOBILE */
    .mob-head{
      display:none;position:fixed;top:0;left:0;right:0;z-index:100;
      background:var(--bg2);border-bottom:1px solid var(--line);
      padding:10px 16px;align-items:center;justify-content:space-between;
    }
    .mob-head .logo{font-weight:600;font-size:0.95rem}
    .mob-head button{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text);padding:4px}
    @media(max-width:640px){
      .side{display:none;width:100%}
      .side.open{display:flex;z-index:200}
      .main{margin-left:0;padding:20px;padding-top:56px}
      .mob-head{display:flex}
      .addr-grid{grid-template-columns:1fr}
      .page-head{flex-direction:column;align-items:flex-start;gap:12px}
    }
    .overflow-x{overflow-x:auto}
  </style>
</head>
<body>

<!-- SETUP -->
<div id="setupScreen" class="auth-wrap hidden">
  <div class="auth-box">
    <div class="auth-logo">Viscose</div>
    <h1>Setup</h1>
    <p class="sub">Create the administrator account to get started.</p>
    <div id="setupAlert"></div>
    <div class="field"><label>Name</label><input id="setupName" type="text" placeholder="Your name"></div>
    <div class="field"><label>Email</label><input id="setupEmail" type="email" placeholder="you@company.com"></div>
    <div class="field"><label>Password</label><input id="setupPass" type="password" placeholder="Min 8 characters"></div>
    <button class="btn btn-dark btn-full" onclick="doSetup()">Create Account</button>
  </div>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="auth-wrap hidden">
  <div class="auth-box">
    <div class="auth-logo">Viscose</div>
    <h1>Welcome</h1>
    <p class="sub">Sign in to continue.</p>
    <div id="loginAlert"></div>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="you@company.com"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Your password"></div>
    <button class="btn btn-dark btn-full" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="hidden">
  <div class="mob-head">
    <span class="logo">Viscose</span>
    <button onclick="document.querySelector('.side').classList.toggle('open')">&#9776;</button>
  </div>
  <div class="app">
    <aside class="side">
      <div class="side-logo">Viscose</div>
      <nav class="side-nav">
        <a href="#" onclick="showPage('addresses')" data-page="addresses"><span class="ico">&#9679;</span> My Addresses</a>
        <a href="#" onclick="showPage('users')" data-page="users" id="navUsers" class="hidden"><span class="ico">&#9679;</span> Users</a>
        <a href="#" onclick="showPage('alladdresses')" data-page="alladdresses" id="navAllAddr" class="hidden"><span class="ico">&#9679;</span> All Addresses</a>
        <a href="#" onclick="showPage('admins')" data-page="admins" id="navAdmins" class="hidden"><span class="ico">&#9679;</span> Manage Admins</a>
      </nav>
      <div class="side-foot">
        <div class="name" id="sidebarName"></div>
        <div class="role" id="sidebarRole"></div>
        <button class="btn btn-sm btn-full" onclick="logout()">Sign Out</button>
      </div>
    </aside>
    <main class="main">

      <div id="page-addresses">
        <div class="page-head">
          <h2>My Addresses</h2>
          <button class="btn btn-dark btn-sm" onclick="openAddressModal()">+ Add</button>
        </div>
        <div class="addr-grid" id="myAddressList"></div>
      </div>

      <div id="page-users" class="hidden">
        <div class="page-head">
          <h2>Users</h2>
          <button class="btn btn-dark btn-sm" onclick="openUserModal()">+ Add User</button>
        </div>
        <div class="card overflow-x">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th><th></th></tr></thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- ADMINS PAGE (superadmin only) -->
      <div id="page-admins" class="hidden">
        <div class="page-head">
          <h2>Manage Admins</h2>
          <button class="btn btn-dark btn-sm" onclick="openAdminModal()">+ Add Admin</button>
        </div>
        <div class="card overflow-x">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
      </div>

      <div id="page-alladdresses" class="hidden">
        <div class="page-head">
          <h2>All Addresses</h2>
          <div class="field" style="margin:0;min-width:200px">
            <select id="userFilter" onchange="loadAllAddresses()">
              <option value="">Select user</option>
            </select>
          </div>
        </div>
        <div class="addr-grid" id="allAddressList"></div>
      </div>

    </main>
  </div>
</div>

<!-- ADDRESS MODAL -->
<div id="addressModal" class="overlay hidden" onclick="if(event.target===this)closeModal('addressModal')">
  <div class="modal">
    <h3 id="addrModalTitle">Add Address</h3>
    <input type="hidden" id="addrEditId">
    <div class="field"><label>Label</label><input id="addrLabel" placeholder="Home, Work, etc."></div>
    <div class="field"><label>Street</label><input id="addrStreet" placeholder="123 Main St"></div>
    <div class="field"><label>City</label><input id="addrCity" placeholder="Brooklyn"></div>
    <div class="field"><label>State</label><input id="addrState" placeholder="NY"></div>
    <div class="field"><label>Zip</label><input id="addrZip" placeholder="11201"></div>
    <div class="field"><label>Country</label><input id="addrCountry" placeholder="USA"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('addressModal')">Cancel</button>
      <button class="btn btn-dark" onclick="saveAddress()">Save</button>
    </div>
  </div>
</div>

<!-- ADMIN MODAL -->
<div id="adminModal" class="overlay hidden" onclick="if(event.target===this)closeModal('adminModal')">
  <div class="modal">
    <h3>Add Admin</h3>
    <div id="adminModalAlert"></div>
    <div class="field"><label>Name</label><input id="newAdminName" placeholder="Full name"></div>
    <div class="field"><label>Email</label><input id="newAdminEmail" type="email" placeholder="admin@company.com"></div>
    <div class="field"><label>Password</label><input id="newAdminPass" type="password" placeholder="Temporary password"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('adminModal')">Cancel</button>
      <button class="btn btn-dark" onclick="createAdmin()">Create Admin</button>
    </div>
  </div>
</div>

<!-- USER MODAL -->
<div id="userModal" class="overlay hidden" onclick="if(event.target===this)closeModal('userModal')">
  <div class="modal">
    <h3>Add User</h3>
    <div id="userModalAlert"></div>
    <div class="field"><label>Name</label><input id="newUserName" placeholder="Full name"></div>
    <div class="field"><label>Email</label><input id="newUserEmail" type="email" placeholder="user@company.com"></div>
    <div class="field"><label>Password</label><input id="newUserPass" type="password" placeholder="Temporary password"></div>
    <div class="field" id="roleField"><label>Role</label>
      <select id="newUserRole"><option value="user">User</option><option value="admin">Admin</option></select>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('userModal')">Cancel</button>
      <button class="btn btn-dark" onclick="createUser()">Create</button>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('viscose_token');
let currentUser = null;
const API = '/api';

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function init() {
  if (token) {
    try {
      const data = await api('/me');
      currentUser = data.user;
      showApp();
    } catch {
      token = null;
      localStorage.removeItem('viscose_token');
      checkSetup();
    }
  } else {
    checkSetup();
  }
}

async function checkSetup() {
  try {
    const res = await fetch(API + '/setup');
    const data = await res.json();
    if (data.error) {
      document.getElementById('setupAlert').innerHTML = '<div class="alert alert-error">' + data.error + '</div>';
    }
    showScreen(data.needsSetup ? 'setupScreen' : 'loginScreen');
  } catch (e) {
    document.getElementById('setupAlert').innerHTML = '<div class="alert alert-error">Cannot connect: ' + e.message + '</div>';
    showScreen('setupScreen');
  }
}

function showScreen(id) {
  ['setupScreen','loginScreen','appScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

async function doSetup() {
  try {
    const res = await fetch(API + '/setup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: document.getElementById('setupName').value, email: document.getElementById('setupEmail').value, password: document.getElementById('setupPass').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Setup failed');
    document.getElementById('setupAlert').innerHTML = '<div class="alert alert-ok">Account created. Signing in...</div>';
    setTimeout(() => showScreen('loginScreen'), 1200);
  } catch (e) {
    document.getElementById('setupAlert').innerHTML = '<div class="alert alert-error">' + e.message + '</div>';
  }
}

async function doLogin() {
  try {
    const res = await fetch(API + '/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPass').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    token = data.token; currentUser = data.user;
    localStorage.setItem('viscose_token', token);
    showApp();
  } catch (e) {
    document.getElementById('loginAlert').innerHTML = '<div class="alert alert-error">' + e.message + '</div>';
  }
}

document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('setupPass').addEventListener('keydown', e => { if (e.key === 'Enter') doSetup(); });

function logout() { token = null; currentUser = null; localStorage.removeItem('viscose_token'); showScreen('loginScreen'); }

function showApp() {
  showScreen('appScreen');
  document.getElementById('sidebarName').textContent = currentUser.name;
  document.getElementById('sidebarRole').textContent = currentUser.role;
  const isAdmin = currentUser.role === 'superadmin' || currentUser.role === 'admin';
  document.getElementById('navUsers').classList.toggle('hidden', !isAdmin);
  document.getElementById('navAllAddr').classList.toggle('hidden', !isAdmin);
  document.getElementById('navAdmins').classList.toggle('hidden', currentUser.role !== 'superadmin');
  if (currentUser.role !== 'superadmin') document.getElementById('roleField').classList.add('hidden');
  showPage('addresses');
}

function showPage(page) {
  document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
  document.getElementById('page-' + page).classList.remove('hidden');
  document.querySelectorAll('.side-nav a').forEach(a => a.classList.remove('active'));
  document.querySelector('[data-page="' + page + '"]')?.classList.add('active');
  document.querySelector('.side')?.classList.remove('open');
  if (page === 'addresses') loadMyAddresses();
  if (page === 'users') loadUsers();
  if (page === 'admins') loadAdmins();
  if (page === 'alladdresses') loadUserOptions();
}

async function loadMyAddresses() {
  try { const d = await api('/addresses'); renderAddresses(d.addresses, 'myAddressList', true); } catch(e) { console.error(e); }
}

function renderAddresses(list, cid, canEdit) {
  const c = document.getElementById(cid);
  if (!list.length) { c.innerHTML = '<div class="empty">No addresses added yet.</div>'; return; }
  c.innerHTML = list.map(a => {
    const full = [a.street, a.city, a.state, a.zip, a.country].filter(Boolean).join(', ');
    const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(full);
    return `<div class="addr-card">
      <div class="addr-card-top">
        <span>${esc(a.label || 'Address')}</span>
        ${canEdit ? `<div class="actions">
          <button onclick="editAddress(${a.id},'${esc(a.label)}','${esc(a.street)}','${esc(a.city)}','${esc(a.state)}','${esc(a.zip)}','${esc(a.country)}')" title="Edit">&#9998;</button>
          <button onclick="deleteAddress(${a.id})" title="Delete">&times;</button>
        </div>` : ''}
      </div>
      <div class="addr-body">${esc(full)}</div>
      <a href="${mapUrl}" target="_blank" rel="noopener" class="map-btn">View on Map &rarr;</a>
    </div>`;
  }).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function openAddressModal() {
  document.getElementById('addrEditId').value = '';
  document.getElementById('addrModalTitle').textContent = 'Add Address';
  ['addrLabel','addrStreet','addrCity','addrState','addrZip','addrCountry'].forEach(f => document.getElementById(f).value = '');
  document.getElementById('addressModal').classList.remove('hidden');
}

function editAddress(id, label, street, city, state, zip, country) {
  document.getElementById('addrEditId').value = id;
  document.getElementById('addrModalTitle').textContent = 'Edit Address';
  document.getElementById('addrLabel').value = label;
  document.getElementById('addrStreet').value = street;
  document.getElementById('addrCity').value = city;
  document.getElementById('addrState').value = state;
  document.getElementById('addrZip').value = zip;
  document.getElementById('addrCountry').value = country;
  document.getElementById('addressModal').classList.remove('hidden');
}

async function saveAddress() {
  const editId = document.getElementById('addrEditId').value;
  const body = { label: document.getElementById('addrLabel').value, street: document.getElementById('addrStreet').value, city: document.getElementById('addrCity').value, state: document.getElementById('addrState').value, zip: document.getElementById('addrZip').value, country: document.getElementById('addrCountry').value };
  if (!body.street) return alert('Street is required');
  try {
    if (editId) await api('/addresses', { method: 'PUT', body: JSON.stringify({ id: parseInt(editId), ...body }) });
    else await api('/addresses', { method: 'POST', body: JSON.stringify(body) });
    closeModal('addressModal'); loadMyAddresses();
  } catch (e) { alert(e.message); }
}

async function deleteAddress(id) {
  if (!confirm('Delete this address?')) return;
  try { await api('/addresses?id=' + id, { method: 'DELETE' }); loadMyAddresses(); } catch(e) { alert(e.message); }
}

async function loadUsers() {
  try {
    const d = await api('/users');
    document.getElementById('userTableBody').innerHTML = d.users.map(u => `<tr>
      <td>${esc(u.name)}</td><td style="color:var(--text2)">${esc(u.email)}</td>
      <td><span class="badge badge-${u.role === 'superadmin' ? 'sa' : u.role}">${u.role}</span></td>
      <td style="color:var(--text3)">${new Date(u.created_at).toLocaleDateString()}</td>
      <td>${u.role !== 'superadmin' ? `<button class="btn btn-red btn-sm" onclick="deleteUser(${u.id},'${esc(u.name)}')">Remove</button>` : ''}</td>
    </tr>`).join('');
  } catch(e) { console.error(e); }
}

function openUserModal() {
  ['newUserName','newUserEmail','newUserPass'].forEach(f => document.getElementById(f).value = '');
  document.getElementById('newUserRole').value = 'user';
  document.getElementById('userModalAlert').innerHTML = '';
  document.getElementById('userModal').classList.remove('hidden');
}

async function createUser() {
  try {
    await api('/users', { method: 'POST', body: JSON.stringify({ name: document.getElementById('newUserName').value, email: document.getElementById('newUserEmail').value, password: document.getElementById('newUserPass').value, role: document.getElementById('newUserRole').value }) });
    closeModal('userModal'); loadUsers();
  } catch(e) { document.getElementById('userModalAlert').innerHTML = '<div class="alert alert-error">' + e.message + '</div>'; }
}

async function deleteUser(id, name) {
  if (!confirm('Remove ' + name + '? Their addresses will also be deleted.')) return;
  try { await api('/users?id=' + id, { method: 'DELETE' }); loadUsers(); } catch(e) { alert(e.message); }
}

async function loadUserOptions() {
  try {
    const d = await api('/users');
    document.getElementById('userFilter').innerHTML = '<option value="">Select user</option>' + d.users.map(u => `<option value="${u.id}">${esc(u.name)} (${esc(u.email)})</option>`).join('');
  } catch(e) { console.error(e); }
}

async function loadAllAddresses() {
  const uid = document.getElementById('userFilter').value;
  if (!uid) { document.getElementById('allAddressList').innerHTML = ''; return; }
  try { const d = await api('/addresses?user_id=' + uid); renderAddresses(d.addresses, 'allAddressList', false); } catch(e) { console.error(e); }
}

// ADMINS
async function loadAdmins() {
  try {
    const d = await api('/users');
    const admins = d.users.filter(u => u.role === 'superadmin' || u.role === 'admin');
    document.getElementById('adminTableBody').innerHTML = admins.map(u => `<tr>
      <td>${esc(u.name)}</td><td style="color:var(--text2)">${esc(u.email)}</td>
      <td><span class="badge badge-${u.role === 'superadmin' ? 'sa' : 'admin'}">${u.role}</span></td>
      <td>${u.role === 'admin' ? `<button class="btn btn-red btn-sm" onclick="removeAdmin(${u.id},'${esc(u.name)}')">Remove</button>` : ''}</td>
    </tr>`).join('');
  } catch(e) { console.error(e); }
}

function openAdminModal() {
  ['newAdminName','newAdminEmail','newAdminPass'].forEach(f => document.getElementById(f).value = '');
  document.getElementById('adminModalAlert').innerHTML = '';
  document.getElementById('adminModal').classList.remove('hidden');
}

async function createAdmin() {
  try {
    await api('/users', { method: 'POST', body: JSON.stringify({ name: document.getElementById('newAdminName').value, email: document.getElementById('newAdminEmail').value, password: document.getElementById('newAdminPass').value, role: 'admin' }) });
    closeModal('adminModal'); loadAdmins();
  } catch(e) { document.getElementById('adminModalAlert').innerHTML = '<div class="alert alert-error">' + e.message + '</div>'; }
}

async function removeAdmin(id, name) {
  if (!confirm('Remove admin ' + name + '?')) return;
  try { await api('/users?id=' + id, { method: 'DELETE' }); loadAdmins(); } catch(e) { alert(e.message); }
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

init();
</script>
</body>
</html>
